services:
  db:
    image: postgres:16-alpine
    container_name: tracksheet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracksheet
      POSTGRES_PASSWORD: tracksheet
      POSTGRES_DB: tracksheet
    ports:
      - "5433:5432"
    volumes:
      - tracksheet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracksheet -d tracksheet"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    container_name: tracksheet-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracksheet
      POSTGRES_PASSWORD: tracksheet
      POSTGRES_DB: tracksheet_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracksheet -d tracksheet_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tracksheet-pgdata:
